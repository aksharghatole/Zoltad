<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOLTAD // GLITCH RUN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell"><header class="mast"><div><span class="eyebrow">NIGHT DISTRICT // 01</span><h1>ZOLTAD<span> / PURSUIT</span></h1></div><button type="button" id="fx" aria-pressed="false">FX: FULL</button></header>
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- glitch overlays -->
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="vignette"></div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-block">
        <span class="label">HEAT</span>
        <div class="bar"><div id="heatBar"></div></div>
      </div>
      <div class="hud-block">
        <span class="label">SPEED</span>
        <span id="speed">0</span>
      </div>
      <div class="hud-block">
        <span class="label">SURVIVED</span>
        <span id="time">0.0</span>
      </div>
    </div>

    <div id="busted" class="hidden">
      <h2>BUSTED</h2>
      <p>PRESS <b>R</b> TO RUN AGAIN</p>
    </div>
  </div>
  <footer class="controls"><span>W A S D / ARROWS — DRIVE</span><span>R — RESTART AFTER CRASH</span><span>KEEP MOVING // EVADE PURSUIT</span></footer></main>
  <script src="visuals.js"></script>
  <script src="game.js"></script>
</body>
</html>
